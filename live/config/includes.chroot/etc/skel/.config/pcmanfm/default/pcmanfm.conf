[config]
bm_open_method=0

[volume]
mount_on_startup=1
mount_removable=1
autorun=0

[desktop]
wallpaper_mode=5
wallpaper_common=1
wallpaper=/usr/share/backgrounds/jadevos-default-wallpaper.jpg
show_wm_menu=1
show_documents=1
show_trash=1
show_mounts=1
desktop_bg=#11191d
desktop_fg=#e8f0f1
desktop_shadow=#000000
desktop_font=Noto Sans 10
